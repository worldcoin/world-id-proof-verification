# Optional Helm values overlay; apply AFTER ../values-world-id-proof-verification.yaml.
# Enable only after all challenge clients sign requests. Unsigned challenges will be rejected.
# The application image must support HTTP_ADDR (the base values pin such an image).
# Remove this overlay from ArgoCD's Helm valueFiles to return to direct application routing.
env:
  HTTP_ADDR: "127.0.0.1:8000"

# Helm replaces lists: include every application port and Service port needed here.
ports:
  - name: http
    containerPort: 8000
    protocol: TCP
service:
  ports:
    - name: http
      port: 80
      targetPort: proxy
      protocol: TCP

# Base readiness/liveness probes and ALB health checks continue through the proxy on 8080.
sidecars:
  - name: attested-proxy
    image: ghcr.io/worldcoin/attested-proxy:sha-9b42aae@sha256:795e48b3cbb163266224469a0e6d56449281e4690b9bb1135e07dc4b0a648b61
    ports:
      - name: proxy
        containerPort: 8080
        protocol: TCP
      - name: admin
        containerPort: 8081
        protocol: TCP
    env:
      - name: ATTESTED_PROXY_UPSTREAM
        value: http://127.0.0.1:8000
      - name: ATTESTED_PROXY_AUTHORITY
        value: app.stage.orb.worldcoin.org
      - name: ATTESTED_PROXY_SCHEME
        value: https
      - name: ATTESTED_PROXY_ISSUERS
        value: "attestation.worldcoin.dev=https://attestation.worldcoin.dev/.well-known/jwks.json,attestation.sandbox.worldcoin.org=https://attestation.sandbox.worldcoin.org/.well-known/jwks.json,ci.attestation.worldcoin.dev=file:///var/run/secrets/ci-ag-jwks/jwks.json"
      - name: ATTESTED_PROXY_AUDIENCES
        value: attestation.worldcoin.dev,app.stage.orb.worldcoin.org
      - name: ATTESTED_PROXY_UNPROTECTED_PATHS
        value: /health,/ready,/api/v1/verify,/api/v4/verify,/api/v1/gen
      - name: RUST_LOG
        value: info
      - name: TELEMETRY_PRESET
        value: datadog
      - name: TELEMETRY_SERVICE_NAME
        value: world-id-proof-verification-attested-proxy
      - name: DD_SERVICE
        value: world-id-proof-verification-attested-proxy
      - name: DD_ENV
        value: stage
      - name: DD_VERSION
        value: sha-9b42aae
      - name: DD_ENTITY_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: DATADOG_AGENT_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
      - name: TELEMETRY_DATADOG_ENDPOINT
        value: "http://$(DATADOG_AGENT_HOST):8126"
      - name: TELEMETRY_METRICS_BACKEND
        value: statsd
      - name: TELEMETRY_STATSD_HOST
        value: "$(DATADOG_AGENT_HOST)"
      - name: TELEMETRY_STATSD_PORT
        value: "8125"
    resources:
      requests:
        cpu: "50m"
        memory: 64Mi
      limits:
        cpu: "250m"
        memory: 128Mi
    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    volumeMounts:
      - name: ci-ag-jwks
        mountPath: /var/run/secrets/ci-ag-jwks
        readOnly: true
    # No JWKS readiness probe: verification must remain available during gateway outages.
    livenessProbe:
      httpGet:
        path: /health
        port: admin

# Provision the public CI issuer JWKS in the application Secret before rollout.
additionalVolumes:
  - name: ci-ag-jwks
    secret:
      secretName: application
      items:
        - key: CI_CANONICAL_REQUEST_VERIFICATION_JWKS
          path: jwks.json
