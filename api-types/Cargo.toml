[package]
name = "api-types"
version = "0.1.0"
edition = "2024"
# These shared types retain compatibility with Rust 1.95.
rust-version = "1.95"
license = "MIT"
publish = false
description = "HTTP types for the World ID 4.x proof verification API"

[dependencies]
chrono = { version = "0.4.31", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
axum = "0.8.9"

[dev-dependencies]
serde_json = "1.0"
world-id-primitives = "=0.18.0"
