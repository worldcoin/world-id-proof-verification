[package]
name = "world-id-proof-verification-client"
version = "0.1.0"
edition = "2024"
# Matches this repo's CI toolchain. The crate does not use newer language features.
rust-version = "1.95"
license = "MIT"
publish = false
description = "Client for World ID 4.x ownership proofs"

[dependencies]
api-types = { version = "0.1.0", path = "../api-types" }
async-trait = "0.1"
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
axum = "0.8"
